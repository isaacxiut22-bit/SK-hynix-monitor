name: Update litigation watch and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8,17 * * *'
      timezone: 'America/Los_Angeles'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "sk-hynix-monitor-and-pages"
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run collector unit tests
        run: python -m unittest discover -s tests -v
      - name: Refresh public-source data
        continue-on-error: true
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
        run: python scripts/monitor.py
      - name: Save data for subsequent runs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tracker-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh SK hynix litigation leads'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4